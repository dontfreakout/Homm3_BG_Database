name: Generate PDF Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run po4a
        uses: qwrtln/po4a-action@v1
        with:
          version: "0.73"
          config: "po4a.cfg"
          args: "--no-update"

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Set cache id
        id: set_cache_id
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_OUTPUT

      - name: Create cache directory
        run: mkdir -p .cache

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ steps.set_cache_id.outputs.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: |
          pip install mkdocs-material \
                     mkdocs-exclude-search \
                     mkdocs-static-i18n \
                     mkdocs-to-pdf

      - name: Generate PDF
        env:
          ENABLE_PDF_EXPORT: 1
        run: mkdocs build

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Heroes of Might & Magic III Board Game Database ${{ steps.tag.outputs.tag }}"
          body: |
            ## 📖 Heroes of Might & Magic III Board Game Database
            
            This release includes the complete database documentation in PDF format.
            
            ### 📄 Files
            - **homm3-bg-database.pdf**: Complete documentation in PDF format
            
            ### 🔗 Links
            - 🌐 [Online Documentation](https://homm3bg.wiki/)
            - 📱 [Discord Community](https://discord.gg/Y4uM9pPWF6)
          files: |
            site/pdf/homm3-bg-database.pdf
          draft: false
          prerelease: false

      - name: Upload PDF as Artifact (for manual releases)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: homm3-bg-database-pdf
          path: site/pdf/homm3-bg-database.pdf